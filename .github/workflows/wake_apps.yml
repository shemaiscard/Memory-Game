name: Bulletproof App Heartbeat

on:
  schedule:
    # Streamlit puts an app to sleep after 12 hours without visitors, and GitHub
    # often starts scheduled runs hours late, so check every 3 hours.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright CLI
        run: pip install playwright

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pip show playwright | grep Version | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers & Deps
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: Wake Apps With Real Browser
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/wake_streamlit_apps.py

      - name: Upload Screenshots Of Apps That Did Not Start
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: heartbeat-screenshots
          path: heartbeat-screenshots/
          retention-days: 7
          if-no-files-found: ignore
